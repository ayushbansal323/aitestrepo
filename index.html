<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Happy Girlfriend's Day, Baby Girl!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Karla:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>
  <div class="hearts-bg" aria-hidden="true"></div>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>
  <div class="hug-bloom hidden" id="hug-bloom" aria-hidden="true"></div>

  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader-seal">
      <span class="loader-heart">♥</span>
    </div>
    <p class="loader-text">a letter for you…</p>
  </div>

  <button class="music-toggle" id="music-toggle" type="button" aria-label="Mute music" title="Mute">
    <span class="music-icon" id="music-icon">♪</span>
  </button>

  <audio id="bg-music" src="soft-song.m4a" loop preload="auto"></audio>

  <main class="app">
    <!-- Screen 1 -->
    <section class="screen active" id="screen-1" data-screen="1">
      <div class="envelope-wrap" id="envelope-wrap">
        <button class="envelope" id="envelope" type="button" aria-label="Open your letter">
          <div class="envelope-flap"></div>
          <div class="envelope-body">
            <div class="wax-seal">
              <span>♥</span>
            </div>
            <p class="envelope-cue">Tap the seal</p>
          </div>
        </button>
      </div>

      <div class="card letter-card hidden" id="screen1-card">
        <div class="stamp" aria-hidden="true">GF Day</div>
        <h1 class="headline typewriter-target" id="screen1-headline"></h1>
        <p class="subtext stagger-item" id="screen1-subtext"></p>
        <button class="btn btn-primary stagger-item cta-delayed" data-next="2">Open your surprise →</button>
      </div>
    </section>

    <!-- Screen 2 -->
    <section class="screen" id="screen-2" data-screen="2">
      <div class="card letter-card">
        <p class="label stagger-item" id="screen2-title"></p>
        <p class="quote stagger-item" id="screen2-main"></p>
        <p class="quote hindlish breath stagger-item" id="screen2-memory"></p>
        <p class="quote hindlish relive breath stagger-item" id="screen2-relive"></p>
        <p class="footnote stagger-item" id="screen2-footnote"></p>
        <button class="btn btn-primary stagger-item" data-next="3">Keep going →</button>
      </div>
    </section>

    <!-- Screen 3 -->
    <section class="screen" id="screen-3" data-screen="3">
      <div class="card letter-card card-wide" id="screen3-card">
        <h2 class="question stagger-item" id="screen3-question"></h2>
        <p class="no-hint" id="no-hint">Go on… try No 💋</p>
        <p class="dodge-message" id="dodge-message" aria-live="polite"></p>
        <div class="button-area" id="button-area">
          <button class="btn btn-yes is-locked" id="btn-yes" disabled aria-disabled="true">Yes</button>
          <button class="btn btn-no" id="btn-no" type="button">No</button>
        </div>
        <p class="yes-reply hidden" id="yes-reply"></p>
      </div>
    </section>

    <!-- Screen 4 -->
    <section class="screen" id="screen-4" data-screen="4">
      <div class="card letter-card">
        <h2 class="headline-sm stagger-item" id="screen4-headline"></h2>
        <p class="reasons-cue" id="reasons-cue">Tap a bloom to reveal a reason</p>
        <div class="reason-blooms" id="reason-blooms" role="group" aria-label="Reasons to reveal"></div>
        <ul class="reasons-list" id="reasons-list"></ul>
        <button class="btn btn-primary hidden scale-in" id="screen4-continue" data-next="5">One more thing →</button>
      </div>
    </section>

    <!-- Screen 5 -->
    <section class="screen" id="screen-5" data-screen="5">
      <div class="card letter-card card-finale">
        <h1 class="headline typewriter-target" id="screen5-headline"></h1>
        <p class="love-note stagger-item finale-delayed" id="screen5-lovenote"></p>
        <p class="closing stagger-item finale-delayed" id="screen5-closing"></p>
        <button class="btn btn-hug stagger-item finale-delayed" id="hug-btn" type="button">Send a hug</button>
        <p class="screenshot-hint stagger-item finale-delayed">Screenshot this if you want ♡</p>
      </div>
    </section>
  </main>

  <nav class="progress" aria-label="Progress">
    <button class="back-btn hidden" id="back-btn" aria-label="Go back">←</button>
    <div class="dots" id="progress-dots">
      <span class="dot active" data-dot="1"></span>
      <span class="dot" data-dot="2"></span>
      <span class="dot" data-dot="3"></span>
      <span class="dot" data-dot="4"></span>
      <span class="dot" data-dot="5"></span>
    </div>
  </nav>

  <script src="script.js"></script>
</body>
</html>
